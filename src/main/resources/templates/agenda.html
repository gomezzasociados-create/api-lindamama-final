<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#d63384">
    <title>Cargando Agenda VIP - Linda Mamá Spa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        // Redireccionar al catálogo con el parámetro para abrir el asistente de agenda
        window.location.replace("/catalogo?paso=agenda");
    </script>
</head>
<body style="background-color: #100118; background-image: radial-gradient(circle, #2a0342 0%, #100118 80%); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Poppins', sans-serif; margin: 0; overflow: hidden; text-align: center; padding: 20px;">
    <div>
        <!-- Spinner animado simple estilo spa neon -->
        <div style="width: 50px; height: 50px; border: 3px solid rgba(255, 0, 255, 0.1); border-top-color: #ff00ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);"></div>
        <h2 style="color: #ffffff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px #ff00ff; margin-bottom: 10px; font-weight: 800; font-size: 1.5rem;">Agenda VIP</h2>
        <p style="color: #00e5ff; font-weight: 600; text-shadow: 0 0 5px rgba(0, 229, 255, 0.5); font-size: 0.95rem; margin-bottom: 20px;">Abriendo tu asistente de reserva guiada...</p>
        <p style="font-size: 0.8rem; color: rgba(255,255,255,0.4);">Si no eres redireccionada automáticamente, haz clic <a href="/catalogo?paso=agenda" style="color: #ff00ff; text-decoration: none; font-weight: bold;">aquí</a>.</p>
    </div>

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
